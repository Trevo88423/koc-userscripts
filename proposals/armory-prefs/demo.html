<script>
    function ClearPrefillPerc() {

        var inputs = document.forms["prefillform"].getElementsByTagName("input");

        for (i = 0; i < inputs.length; i++) {
            if(document.forms["prefillform"].getElementsByTagName("input")[i].type == "number"){
                document.forms["prefillform"].getElementsByTagName("input")[i].value = 0;
            }
        }
    }
</script>
