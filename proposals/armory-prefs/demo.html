<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
	<title>Armory Preferences Demo</title>
	<!-- Mock of the Armory Preferences form, for trying armory-prefs.js locally.
	     The real form's markup may differ; the script only relies on the
	     prefs[...] input names and the "Clear Percentage Prefills" button. -->
	<style type="text/css">
		body { background: #000; color: #fff; font-family: verdana, arial; font-size: 10pt; }
		table.table_lines { border: 1px solid #555; border-collapse: collapse; }
		table.table_lines th, table.table_lines td { border: 1px solid #333; padding: 3px 6px; }
		th.subh { background: #222; }
	</style>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
</head>
<body>
	<form method="post" action="armory.php">
		<table class="table_lines" width="100%" cellspacing="0" cellpadding="6">
			<tr><th colspan="3">Armory Preferences</th></tr>
			<tr><th class="subh">Type</th><th class="subh">Percentage</th><th class="subh">Weapon</th></tr>
			<tr>
				<td>Attack</td>
				<td><input type="text" name="prefs[attack]" value="40" size="3"></td>
				<td><select name="prefs[attweapon]"><option>Best available</option></select></td>
			</tr>
			<tr>
				<td>Defense</td>
				<td><input type="text" name="prefs[defend]" value="20" size="3"></td>
				<td><select name="prefs[defweapon]"><option>Best available</option></select></td>
			</tr>
			<tr>
				<td>Spy</td>
				<td><input type="text" name="prefs[spy]" value="10" size="3"></td>
				<td><select name="prefs[spyweapon]"><option>Best available</option></select></td>
			</tr>
			<tr>
				<td>Sentry</td>
				<td><input type="text" name="prefs[sentry]" value="10" size="3"></td>
				<td><select name="prefs[sentryweapon]"><option>Best available</option></select></td>
			</tr>
			<tr>
				<td>Poison</td>
				<td><input type="text" name="prefs[poison]" value="5" size="3"></td>
				<td><select name="prefs[poisonweapon]"><option>Best available</option></select></td>
			</tr>
			<tr>
				<td>Antidote</td>
				<td><input type="text" name="prefs[medicine]" value="5" size="3"></td>
				<td><select name="prefs[medicineweapon]"><option>Best available</option></select></td>
			</tr>
			<tr>
				<td>Theft</td>
				<td><input type="text" name="prefs[theft]" value="5" size="3"></td>
				<td><select name="prefs[theftweapon]"><option>Best available</option></select></td>
			</tr>
			<tr>
				<td>Vigilance</td>
				<td><input type="text" name="prefs[vigilance]" value="5" size="3"></td>
				<td><select name="prefs[vigilanceweapon]"><option>Best available</option></select></td>
			</tr>
			<tr>
				<td colspan="3" align="center">
					<input type="submit" value="Update Preferences">
					<input type="button" value="Clear Percentage Prefills"
						onclick="$('input[name^=&quot;prefs[&quot;][type=text]').val(0)">
				</td>
			</tr>
		</table>
	</form>
	<script src="armory-prefs.js"></script>
</body>
</html>
